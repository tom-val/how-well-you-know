name: Deploy Prod

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test KnowMe.API/KnowMe.API.sln -c Release

  infra:
    name: Infrastructure
    needs: test
    runs-on: ubuntu-latest
    environment: Prod
    defaults:
      run:
        working-directory: infra/environments/prod
    outputs:
      lambda_function_name: ${{ steps.outputs.outputs.lambda_function_name }}
      authorizer_function_name: ${{ steps.outputs.outputs.authorizer_function_name }}
      ws_connections_function_name: ${{ steps.outputs.outputs.ws_connections_function_name }}
      ws_connect_url: ${{ steps.outputs.outputs.ws_connect_url }}
      api_endpoint: ${{ steps.outputs.outputs.api_endpoint }}
      cognito_user_pool_id: ${{ steps.outputs.outputs.cognito_user_pool_id }}
      cognito_client_id: ${{ steps.outputs.outputs.cognito_client_id }}
      cognito_hosted_domain: ${{ steps.outputs.outputs.cognito_hosted_domain }}
      s3_frontend_bucket: ${{ steps.outputs.outputs.s3_frontend_bucket }}
      cloudfront_distribution_id: ${{ steps.outputs.outputs.cloudfront_distribution_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
        env:
          # Optional — empty disables AI suggestions (clients fall back to the static bank).
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          # Optional — empty leaves Google sign-in disabled (email/password still works).
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Export outputs
        id: outputs
        run: |
          echo "lambda_function_name=$(terraform output -raw lambda_function_name)" >> "$GITHUB_OUTPUT"
          echo "authorizer_function_name=$(terraform output -raw authorizer_function_name)" >> "$GITHUB_OUTPUT"
          echo "ws_connections_function_name=$(terraform output -raw ws_connections_function_name)" >> "$GITHUB_OUTPUT"
          echo "ws_connect_url=$(terraform output -raw ws_connect_url)" >> "$GITHUB_OUTPUT"
          echo "api_endpoint=$(terraform output -raw api_endpoint)" >> "$GITHUB_OUTPUT"
          echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id)" >> "$GITHUB_OUTPUT"
          echo "cognito_client_id=$(terraform output -raw cognito_client_id)" >> "$GITHUB_OUTPUT"
          echo "cognito_hosted_domain=$(terraform output -raw cognito_hosted_domain)" >> "$GITHUB_OUTPUT"
          echo "s3_frontend_bucket=$(terraform output -raw s3_frontend_bucket)" >> "$GITHUB_OUTPUT"
          echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

  backend:
    name: Deploy Backend
    needs: infra
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Publish
        run: dotnet publish KnowMe.API/KnowMe.API/KnowMe.API.csproj -c Release -r linux-arm64 -o publish

      - name: Package
        run: cd publish && zip -r ../lambda.zip .

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ needs.infra.outputs.lambda_function_name }} \
            --zip-file fileb://lambda.zip

  authorizer:
    name: Deploy Authorizer
    needs: infra
    runs-on: ubuntu-latest
    environment: Prod
    defaults:
      run:
        working-directory: KnowMe.API/authorizer
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: KnowMe.API/authorizer/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Install dependencies
        run: npm ci

      - name: Package
        run: zip -r ../authorizer.zip . -x '*.git*'

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ needs.infra.outputs.authorizer_function_name }} \
            --zip-file fileb://../authorizer.zip

  websocket:
    name: Deploy WebSocket Lambda
    needs: infra
    runs-on: ubuntu-latest
    environment: Prod
    defaults:
      run:
        working-directory: KnowMe.API/ws-connections
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: KnowMe.API/ws-connections/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Install dependencies
        run: npm ci

      - name: Package
        run: zip -r ../ws-connections.zip . -x '*.git*'

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ needs.infra.outputs.ws_connections_function_name }} \
            --zip-file fileb://../ws-connections.zip

  frontend:
    name: Deploy Frontend
    needs: infra
    runs-on: ubuntu-latest
    environment: Prod
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ needs.infra.outputs.api_endpoint }}
          VITE_COGNITO_USER_POOL_ID: ${{ needs.infra.outputs.cognito_user_pool_id }}
          VITE_COGNITO_CLIENT_ID: ${{ needs.infra.outputs.cognito_client_id }}
          VITE_COGNITO_DOMAIN: ${{ needs.infra.outputs.cognito_hosted_domain }}
          VITE_WS_URL: ${{ needs.infra.outputs.ws_connect_url }}

      - name: Sync to S3
        run: aws s3 sync dist/ "s3://${{ needs.infra.outputs.s3_frontend_bucket }}" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.infra.outputs.cloudfront_distribution_id }} \
            --paths "/*"
